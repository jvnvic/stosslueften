# Generated by `python -m sweeps.generate configs/sweep/train-a-v2/spec.yaml` (seed 20261027). Do not edit; change the spec and generate again.
# One simulation case. Lengths in metres, angles in degrees, speeds in m/s.
# Every key is required; see PLAN.md §1–2 for what the values mean.

case_id: train-a-v2_260              # becomes the folder name cases/<case_id>/

# --- Varied inputs (sampled in sweeps) ---
layout: adjacent_walls        # same_wall | opposite_walls | adjacent_walls
window1: {x_m: 3.499, mode: tilt, angle_deg: 6, hinge: left}    # mode: turn | tilt; hinge: left | right, seen from inside
window2: {x_m: 1.785, mode: turn, angle_deg: 54.8, hinge: left}
wind_speed_ms: 3.76            # at roof height; wind always comes from the south

# --- Fixed setup (PLAN.md §1) ---
room:
  width_m: 5.0                # x: south and north walls
  depth_m: 4.0                # y: west and east walls
  height_m: 2.5
  wall_thickness_m: 0.3       # walls and roof
window_size:
  width_m: 1.0
  height_m: 1.25
  sill_height_m: 0.9
  sash_thickness_m: 0.06
  hinge_radius_m: 0.04        # solid hinge post the sash turns around
clearance_m: 0.2              # min. distance of window frames to room corners and to each other

# --- Numerics (tuned in the week-1 benchmark) ---
domain:                       # outdoor air region, in multiples of building height H = 2.8 m
  upstream_H: 5
  downstream_H: 15
  lateral_H: 5
  top_H: 5
mesh:                         # target cell sizes
  mesher: snappy              # gmsh (tetrahedra) | snappy (hex-dominant, snappyHexMesh)
  window_m: 0.05              # at sashes and window openings
  room_m: 0.2                 # inside the room
  building_m: 0.4             # outdoors near the building
  far_m: 2.0                  # far from the building

# --- Flow solver (PLAN.md §1, §5) ---
flow:
  roughness_length_m: 0.03    # ground roughness z0 of the wind profile (open terrain)
  max_iterations: 2000        # steady solver stops here at the latest
  n_procs: 8                  # CPU cores used for one case
  tracer_duration_s: 600      # simulated time of the air replacement (10 min)
  tracer_time_step_s: 0.2     # time step of the tracer solver
  transient_spinup_s: 60      # transient comparison run: flow-only time before the tracer starts
  transient_max_courant: 10   # transient comparison run: time step limit
