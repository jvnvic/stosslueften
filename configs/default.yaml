# One simulation case. Lengths in metres, angles in degrees, speeds in m/s.
# Every key is required; see PLAN.md §1–2 for what the values mean.

case_id: default              # becomes the folder name cases/<case_id>/

# --- Varied inputs (sampled in sweeps) ---
layout: opposite_walls        # same_wall | opposite_walls | adjacent_walls
window1: {x_m: 2.5, mode: turn, angle_deg: 90, hinge: left}    # mode: turn | tilt; hinge: left | right, seen from inside
window2: {x_m: 2.5, mode: turn, angle_deg: 90, hinge: left}
wind_speed_ms: 3.0            # at roof height; wind always comes from the south

# --- Fixed setup (PLAN.md §1) ---
room:
  width_m: 5.0                # x: south and north walls
  depth_m: 4.0                # y: west and east walls
  height_m: 2.5
  wall_thickness_m: 0.3       # walls and roof
window_size:
  width_m: 1.0
  height_m: 1.25
  sill_height_m: 0.9
  sash_thickness_m: 0.06
  hinge_radius_m: 0.04        # solid hinge post the sash turns around
clearance_m: 0.2              # min. distance of window frames to room corners and to each other

# --- Numerics (tuned in the week-1 benchmark) ---
domain:                       # outdoor air region, in multiples of building height H = 2.8 m
  upstream_H: 5
  downstream_H: 15
  lateral_H: 5
  top_H: 5
mesh:                         # target cell sizes
  window_m: 0.05              # at sashes and window openings
  room_m: 0.2                 # inside the room
  building_m: 0.4             # outdoors near the building
  far_m: 2.0                  # far from the building
