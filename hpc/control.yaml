# What the sweep runner on the simulation PC should do (hpc/README.md). Edit and push to main;
# the runner reads it within a minute and shows what it did on the dashboard.
state: pause          # run | pause (finish running cases, start no new ones) | stop (abort running cases, requeue them)
runs: []              # runs to work on, in this order, e.g. [train-v1, test-v1]; each needs hpc/runs/<run>.yaml
skip: []              # case ids to leave out, e.g. [train-v1_017]
retry: []             # failed case ids to run again
runner_ref: main      # runner code version; applied when paused and no case runs
