# /etc/wsl.conf inside Ubuntu. install_ubuntu.sh installs it and adds the [user] section.
# Takes effect after `wsl --shutdown` in Windows.

[boot]
# systemd will run the sweep runner as a service (HPC_PLAN.md section 5)
systemd=true

[interop]
# keep the Windows folders out of the Linux PATH: faster shells, no Windows tools in place of Linux ones
appendWindowsPath=false
